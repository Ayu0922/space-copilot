</head>

    <!-- ==========================
            HERO
    =========================== -->

    <section class="hero-section" style="padding: 50px 0px 0px 0px !important;">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-lg-9 text-center">

                    <h1 class="hero-title" style="margin-top: 4rem !important;">

                        Upload Your Document 

                    </h1>

                    <p class="hero-subtitle">

                    Browse document and upload here ....

                    </p>

                </div>

            </div>

        </div>

    </section>
    <!-- Upload Card -->

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-7">

                <div class="card shadow-lg">

                    <div class="card-header">

                        <h4>

                            <i class="fas fa-cloud-upload-alt me-2"></i>

                            Upload Research PDF

                        </h4>

                    </div>

                    <div class="card-body">

                        <div id="dropArea"
                            class="upload-box">

                            <i class="fas fa-file-pdf upload-icon"></i>

                            <h4>

                                Drag & Drop PDF Here

                            </h4>

                            <p>

                                or

                            </p>

                            <button
                                class="btn btn-primary"
                                id="browseBtn">

                                Browse PDF

                            </button>

                            <input
                                type="file"
                                id="pdfFile"
                                accept=".pdf"
                                hidden>

                        </div>

                        <div class="mt-4 text-center">

                            <button
                                class="btn btn-success px-4"
                                id="uploadBtn">

                                <i class="fas fa-upload me-2"></i>

                                Upload PDF

                            </button>

                        </div>

                        <div
                            class="text-center mt-4 d-none"
                            id="loader">

                            <div class="spinner-border text-info"></div>

                            <p class="mt-2">

                                Uploading PDF...

                            </p>

                        </div>

                        <div
                            class="mt-4"
                            id="result">

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

<script src="js/upload.js"></script>

</body>

</html>
